name: chartcoach-local

services:
  mongo:
    image: mongo:8.0.14
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CHARTCOACH_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CHARTCOACH_MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - chartcoach-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --port 27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  simulator-mongo:
    image: mongo:8.0.14
    restart: unless-stopped
    command: ["mongod", "--replSet", "simulator-rs", "--bind_ip_all", "--port", "27019"]
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - chartcoach-simulator-mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --port 27019
          --eval "try { if (rs.status().members.some(function (member) { return member.stateStr === 'PRIMARY'; })) { quit(0); } }
          catch (statusError) { try { rs.initiate({_id: 'simulator-rs', members: [{_id: 0, host: '127.0.0.1:27019'}]}); } catch (initError) {} }
          quit(1)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  simulator-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - chartcoach-simulator-redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  chartcoach-mongo-data:
    name: chartcoach-local-mongo-data
  chartcoach-simulator-mongo:
    name: chartcoach-simulator-mongo
  chartcoach-simulator-redis:
    name: chartcoach-simulator-redis
